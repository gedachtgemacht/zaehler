/* gedacht.gemacht. base, gemeinsam für zähler. vorrat. beleg. */
:root{
  --bg:#0d0d10; --s1:#15151a; --s2:#1c1c23; --s3:#25252e; --line:#2a2a33;
  --tx:#ecebf2; --mu:#8b8a97; --mu2:#5f5e6a;
  --ac:#9b8afb; --ac2:#7d6bf0; --acbg:rgba(155,138,251,.13);
  --ok:#5fd39a; --okbg:rgba(95,211,154,.13);
  --wa:#f2c25c; --wabg:rgba(242,194,92,.13);
  --ba:#f2777a; --babg:rgba(242,119,122,.13);
  --r:14px; --r2:10px;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --navh:64px;
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#f6f5f9; --s1:#ffffff; --s2:#f0eef6; --s3:#e5e2ef; --line:#e1dfe9;
  --tx:#17161c; --mu:#6c6a78; --mu2:#9a98a6;
  --ac:#6d5ae6; --ac2:#5a47d6; --acbg:rgba(109,90,230,.10);
  --ok:#1f9d63; --okbg:rgba(31,157,99,.10);
  --wa:#b7820f; --wabg:rgba(183,130,15,.11);
  --ba:#d6454a; --babg:rgba(214,69,74,.10);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ac)}
.app{max-width:560px;margin:0 auto;min-height:100dvh;padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 24px)}
.app.nonav{padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}

/* Kopf */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{font:600 20px/1 var(--mono);letter-spacing:-.02em;margin-right:auto}
.brand b{color:var(--ac);font-weight:600}
.bar .sub{font:12px var(--mono);color:var(--mu);margin-left:2px}
.view{padding:4px 16px 0}
.h{font:600 13px var(--mono);color:var(--mu);text-transform:lowercase;letter-spacing:.02em;margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
.h .r{margin-left:auto;font-weight:400}

/* Karten */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px}
.card.tight{padding:12px 14px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:600}
.muted{color:var(--mu)} .mu2{color:var(--mu2)}
.small{font-size:13px} .tiny{font-size:12px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font:600 34px/1.05 var(--mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mid{font:600 22px/1.1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)} .wa{color:var(--wa)} .ba{color:var(--ba)} .ac{color:var(--ac)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--s2);border-radius:var(--r2);padding:10px 12px}
.stat .k{font:12px var(--mono);color:var(--mu)}
.stat .v{font:600 17px var(--mono);margin-top:2px;font-variant-numeric:tabular-nums}
.sep{height:1px;background:var(--line);margin:12px 0}
.flex{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wrap{flex-wrap:wrap}
.right{margin-left:auto}

/* Liste */
.list{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.item:first-child{border-top:0}
.item:active{background:var(--s2)}
.item .m{flex:1;min-width:0}
.item .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .e{text-align:right;flex:none}
.thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;background:var(--s3);flex:none;display:grid;place-items:center;color:var(--mu);font:600 15px var(--mono)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--mu2)}
.dot.ok{background:var(--ok)} .dot.wa{background:var(--wa)} .dot.ba{background:var(--ba)} .dot.ac{background:var(--ac)}

/* Chips und Segmente */
.chip{display:inline-flex;align-items:center;gap:5px;font:500 12px var(--mono);padding:4px 9px;border-radius:99px;background:var(--s3);color:var(--mu);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.wa{background:var(--wabg);color:var(--wa)} .chip.ba{background:var(--babg);color:var(--ba)} .chip.ac{background:var(--acbg);color:var(--ac)}
.seg{display:flex;background:var(--s2);border-radius:11px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:8px;font:500 13px var(--sans);color:var(--mu);white-space:nowrap;cursor:pointer}
.seg button.on{background:var(--s1);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.25)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--s2);padding:11px 16px;border-radius:12px;font-weight:500;cursor:pointer;min-height:44px;text-decoration:none;color:var(--tx)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ac);border-color:var(--ac);color:#0d0d10;font-weight:600}
:root[data-theme=light] .btn.primary{color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--mu)}
.btn.danger{color:var(--ba);background:var(--babg);border-color:transparent}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:none;color:var(--mu);display:grid;place-items:center;cursor:pointer}
.icon-btn:active{background:var(--s2)}
.icon-btn svg,.btn svg,.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btns{display:flex;gap:8px;margin-top:14px}
.btns .btn{flex:1}
.fab{position:fixed;z-index:30;right:max(16px,calc(50vw - 264px));bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 16px);width:58px;height:58px;border-radius:18px;border:0;background:var(--ac);color:#0d0d10;display:grid;place-items:center;box-shadow:0 8px 24px rgba(125,107,240,.35);cursor:pointer}
.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.nonav .fab{bottom:calc(env(safe-area-inset-bottom) + 20px)}

/* Untere Navigation */
.tabs{position:fixed;z-index:25;left:0;right:0;bottom:0;display:flex;justify-content:center;background:color-mix(in srgb,var(--s1) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;height:var(--navh);border:0;background:none;color:var(--mu2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 11px var(--mono);cursor:pointer}
.tabs button.on{color:var(--ac)}

/* Formular */
.field{display:block;margin:0 0 12px}
.field>span{display:block;font:500 12px var(--mono);color:var(--mu);margin:0 0 6px 2px}
.field small{display:block;color:var(--mu2);font-size:12px;margin:5px 2px 0}
input,select,textarea{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:11px;padding:12px 13px;min-height:46px;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acbg)}
input[type=number],input.mono{font-family:var(--mono)}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--ac)}
textarea{min-height:80px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;padding:6px 2px;margin-bottom:8px}

/* Sheet (Dialog von unten) */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92dvh;background:var(--s1);color:var(--tx);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
dialog.sheet::backdrop{background:rgba(5,5,8,.6);backdrop-filter:blur(3px)}
dialog.sheet[open]{animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--s3);margin:9px auto 2px}
.sheet .sh{display:flex;align-items:center;padding:8px 12px 4px 18px}
.sheet .sh h2{font:600 17px var(--sans);margin:0;flex:1}
.sheet .sb{padding:8px 18px calc(env(safe-area-inset-bottom) + 18px);overflow:auto;max-height:calc(92dvh - 60px)}

/* Diverses */
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 90px);transform:translateX(-50%) translateY(20px);opacity:0;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;font-size:14px;z-index:100;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:40px 24px;color:var(--mu)}
.empty .ico{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;background:var(--acbg);color:var(--ac);display:grid;place-items:center}
.empty .ico svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty h3{color:var(--tx);margin:0 0 6px;font-size:17px}
.empty p{margin:0 0 18px;font-size:14px}

<div class="app" id="app">
  <header class="bar" id="bar"></header>
  <main class="view" id="view"></main>
</div>
<button class="fab hide" id="fab" aria-label="Zählerstand erfassen"></button>

<script>/* gedacht.gemacht. core: lokaler Speicher, Formatierung, Kalender, Export. Keine Netzwerkzugriffe. AGPL-3.0 */
(function () {
  'use strict';
  const gg = {};

  /* ---------- IndexedDB ---------- */
  // openDB('zaehler', ['meters','readings','blobs','meta']) -> {all,get,put,del,clear,names}
  gg.openDB = function (name, stores, version) {
    return new Promise((res, rej) => {
      const rq = indexedDB.open('gg-' + name, version || 1);
      rq.onupgradeneeded = () => {
        const db = rq.result;
        stores.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }); });
      };
      rq.onerror = () => rej(rq.error);
      rq.onsuccess = () => {
        const db = rq.result;
        const tx = (s, mode, fn) => new Promise((ok, ko) => {
          const t = db.transaction(s, mode); const st = t.objectStore(s); let out;
          const r = fn(st); if (r) r.onsuccess = () => { out = r.result; };
          t.oncomplete = () => ok(out); t.onerror = () => ko(t.error); t.onabort = () => ko(t.error);
        });
        res({
          db, names: stores,
          all: s => tx(s, 'readonly', st => st.getAll()),
          get: (s, id) => tx(s, 'readonly', st => st.get(id)),
          put: (s, obj) => tx(s, 'readwrite', st => st.put(obj)).then(() => obj),
          del: (s, id) => tx(s, 'readwrite', st => st.delete(id)),
          clear: s => tx(s, 'readwrite', st => st.clear())
        });
      };
    });
  };

  gg.uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  gg.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  gg.$ = (sel, el) => (el || document).querySelector(sel);
  gg.$$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));

  /* ---------- Zahlen und Daten (de-DE) ---------- */
  const nf = (d) => new Intl.NumberFormat('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
  gg.num = (n, d = 0) => (n == null || isNaN(n)) ? '·' : nf(d).format(n);
  gg.eur = (n, d = 2) => (n == null || isNaN(n)) ? '·' : nf(d).format(n) + ' €';
  gg.parseNum = s => { if (typeof s === 'number') return s; s = String(s || '').trim().replace(/\s/g, ''); if (!s) return NaN; if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); return parseFloat(s); };
  gg.today = () => gg.iso(new Date());
  gg.iso = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
  gg.d = iso => { const [y, m, dd] = String(iso).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, dd, 12); };
  gg.date = iso => iso ? gg.d(iso).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '·';
  gg.dateShort = iso => iso ? gg.d(iso).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) : '·';
  gg.dateLong = iso => iso ? gg.d(iso).toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' }) : '·';
  gg.month = iso => gg.d(iso).toLocaleDateString('de-DE', { month: 'short', year: '2-digit' });
  gg.days = (a, b) => Math.round((gg.d(b) - gg.d(a)) / 864e5); // b minus a in Tagen
  gg.addDays = (iso, n) => { const x = gg.d(iso); x.setDate(x.getDate() + n); return gg.iso(x); };
  gg.addMonths = (iso, n) => { const x = gg.d(iso); const day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + n); const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(day, last)); return gg.iso(x); };
  gg.relDays = n => n === 0 ? 'heute' : n === 1 ? 'morgen' : n === -1 ? 'gestern' : n > 0 ? 'in ' + n + ' Tagen' : 'vor ' + (-n) + ' Tagen';

  /* ---------- Bilder ---------- */
  // Verkleinert Fotos lokal (Canvas), damit der Speicher nicht vollläuft.
  gg.compress = (file, max = 1600, q = 0.8) => new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      let { width: w, height: h } = img; const k = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * k); h = Math.round(h * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Bild konnte nicht gelesen werden')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Bild konnte nicht gelesen werden')); };
    img.src = url;
  });
  const urls = new Map();
  gg.blobUrl = (key, blob) => { if (!blob) return ''; if (urls.has(key)) return urls.get(key); const u = URL.createObjectURL(blob); urls.set(key, u); return u; };
  gg.blobToDataURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
  gg.dataURLToBlob = async d => (await fetch(d)).blob();

  /* ---------- Dateien ---------- */
  gg.download = (filename, data, mime) => {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  };
  // Teilen über das Handy (Teilen-Menü), sonst Download.
  gg.shareFile = async (filename, data, mime) => {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
    try {
      const f = new File([blob], filename, { type: mime || blob.type });
      if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: filename }); return true; }
    } catch (e) { if (e && e.name === 'AbortError') return false; }
    gg.download(filename, blob, mime); return true;
  };
  // CSV für deutsches Excel: Semikolon, Komma als Dezimaltrenner, BOM.
  gg.csv = rows => '\ufeff' + rows.map(r => r.map(v => {
    if (typeof v === 'number') v = String(v).replace('.', ',');
    v = v == null ? '' : String(v);
    return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }).join(';')).join('\r\n');

  /* ---------- Kalender (.ics) ---------- */
  // Erinnerungen ohne Server: Termin mit Alarm in den Handykalender.
  // ev: {uid, title, date:'YYYY-MM-DD', desc, alarm:[Tage vorher...], rrule:'FREQ=MONTHLY'}
  const icsEsc = s => String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, m => '\\' + m);
  const fold = l => { const out = []; while (l.length > 74) { out.push(l.slice(0, 74)); l = ' ' + l.slice(74); } out.push(l); return out.join('\r\n'); };
  gg.ics = (calName, events) => {
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
    const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//gedacht.gemacht.//' + calName + '//DE', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:' + icsEsc(calName)];
    events.forEach(e => {
      const d = e.date.replace(/-/g, ''); const d2 = gg.addDays(e.date, 1).replace(/-/g, '');
      L.push('BEGIN:VEVENT', 'UID:' + e.uid + '@gedachtgemacht', 'DTSTAMP:' + stamp, 'DTSTART;VALUE=DATE:' + d, 'DTEND;VALUE=DATE:' + d2, 'SUMMARY:' + icsEsc(e.title));
      if (e.desc) L.push('DESCRIPTION:' + icsEsc(e.desc));
      if (e.rrule) L.push('RRULE:' + e.rrule);
      // Alarm jeweils um 9 Uhr, n Tage vor dem (ganztägigen) Termin
      (e.alarm || [0]).forEach(n => { const h = n * 24 - 9; L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(e.title), 'TRIGGER:' + (h > 0 ? '-PT' + h + 'H' : 'PT' + (-h) + 'H'), 'END:VALARM'); });
      L.push('END:VEVENT');
    });
    L.push('END:VCALENDAR');
    return L.map(fold).join('\r\n') + '\r\n';
  };
  // Hinweis: TRIGGER ohne Minus bei 0 Tagen = am Tag um 9 Uhr (ganztägiger Termin startet 0 Uhr).

  /* ---------- Sicherung ---------- */
  // Exportiert alle Stores inkl. Blobs als eine JSON Datei.
  gg.backupExport = async (app, db) => {
    const out = { app, version: 1, exported: new Date().toISOString(), stores: {} };
    for (const s of db.names) {
      const rows = await db.all(s);
      out.stores[s] = await Promise.all(rows.map(async r => {
        const c = { ...r };
        for (const k of Object.keys(c)) if (c[k] instanceof Blob) c[k] = { __blob: await gg.blobToDataURL(c[k]) };
        return c;
      }));
    }
    return JSON.stringify(out);
  };
  gg.backupImport = async (app, db, text) => {
    const data = JSON.parse(text);
    if (data.app !== app) throw new Error('Diese Sicherung gehört zu ' + (data.app || 'einer anderen App'));
    for (const s of db.names) {
      if (!data.stores[s]) continue;
      await db.clear(s);
      for (const r of data.stores[s]) {
        for (const k of Object.keys(r)) if (r[k] && r[k].__blob) r[k] = await gg.dataURLToBlob(r[k].__blob);
        await db.put(s, r);
      }
    }
  };
  gg.pickFile = (accept, capture) => new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept || '*/*'; if (capture) i.setAttribute('capture', capture);
    i.onchange = () => res(i.files[0] || null); i.click();
  });

  /* ---------- UI Helfer ---------- */
  let tt;
  gg.toast = msg => {
    let t = gg.$('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2400);
  };
  // gg.sheet(title, html) öffnet ein Bottom Sheet und gibt das Element zurück.
  gg.sheet = (title, html, onClose) => {
    const d = document.createElement('dialog'); d.className = 'sheet';
    d.innerHTML = '<div class="grab"></div><div class="sh"><h2>' + gg.esc(title) + '</h2><button class="icon-btn" data-close aria-label="Schließen">' + gg.icon('x') + '</button></div><div class="sb">' + html + '</div>';
    document.body.appendChild(d);
    d.addEventListener('click', e => { if (e.target === d || e.target.closest('[data-close]')) d.close(); });
    d.addEventListener('close', () => { d.remove(); onClose && onClose(); });
    d.showModal(); return d;
  };
  gg.confirm = (msg, yes = 'Löschen', danger = true) => new Promise(res => {
    let v = false;

  const dn = iso => { const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };

  function period(m) {

  const billUnit = m => (m.conv ? 'kWh' : (m.unit || 'kWh'));

  // Tarifstufen: Grundwerte ab Beginn, Preisänderungen ab Datum
  function tariffs(m, P) {
    const list = [{ t: 0, price: +m.price || 0, base: +m.base || 0, adv: +m.advance || 0 }];

      });

  }

  // Ablesungen der aktuellen Periode in Reihenfolge, mit Verbrauch je Abschnitt (inkl. Zählerwechsel)

      .map(r => ({ r, t: dn(r.date) - P.s }))
      .filter(x => x.t > 0 && x.t <= P.T + EXT)
      .sort((a, b) => a.t - b.t || (a.r.created || 0) - (b.r.created || 0));

  }

  function check(m, readings, draft) {

    wasser: { label: 'Wasser', icon: 'drop', unit: 'm³', name: 'Wasser' },

    sonst: { label: 'Sonstiges', icon: 'box', unit: 'kWh', name: 'Zähler' }
  };
  const ST = { ok: 'reicht', wa: 'knapp', ba: 'reicht nicht', none: 'noch offen' };
  const MI = 'JFMAMJJASOND';
  const MN = ['januar', 'februar', 'märz', 'april', 'mai', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'dezember'];
  const S = { tab: 'home', detail: null, filter: 'all', meters: [], groups: [], readings: [], periods: [], meta: { id: 'settings', remindDay: 1 } };
  let db;

  /* ---------- Format ---------- */
  const fc = v => v == null || !isFinite(v) ? '·' : gg.num(v, Math.abs(v) >= 100 ? 0 : Math.abs(v) >= 10 ? 1 : 2);
  const decs = v => { const s = String(v); const i = s.indexOf('.'); return i < 0 ? 0 : Math.min(3, s.length - i - 1); };
  const fv = v => v == null || !isFinite(v) ? '·' : gg.num(v, decs(+(+v).toFixed(3)));
  const e0 = v => gg.num(Math.abs(Math.round(v))) + ' €';
  const pct = (v, d = 1) => gg.num(v * 100, d) + ' %';
  const fin = v => v == null || v === '' || !isFinite(v) ? '' : String(+(+v).toFixed(4)).replace('.', ',');
  const head = d => { const r = Math.round(d); return r > 0 ? { n: '+ ' + gg.num(r) + ' €', h: '<small>+</small>' + gg.num(r) + '<small class="e">€</small>', l: 'Nachzahlung' } : { n: gg.num(-r) + ' €', h: gg.num(-r) + '<small class="e">€</small>', l: 'Guthaben' }; };
  const r5 = v => Math.round(v / 5) * 5;
  const side = x => x > 0 ? gg.num(x) + ' € Nachzahlung' : gg.num(-x) + ' € Guthaben';
  function rangeText(lo, hi) {
    lo = r5(lo); hi = r5(hi); if (lo === hi) return '';
    if (lo > 0 && hi > 0) return 'Spanne ' + gg.num(lo) + ' bis ' + gg.num(hi) + ' € Nachzahlung';
    if (lo <= 0 && hi <= 0) return 'Spanne ' + gg.num(-hi) + ' bis ' + gg.num(-lo) + ' € Guthaben';
    return 'Spanne ' + side(lo) + ' bis ' + side(hi);
  }
  const tday = () => gg.today();
  const meterById = id => S.meters.find(m => m.id === id);
  const groupById = id => id ? S.groups.find(g => g.id === id) : null;
  const grpOf = m => groupById(m.group);
  const membersOf = g => S.meters.filter(m => m.group === g.id);
  // Zähler im Sammel-Abschlag zahlen nicht selbst: eigener Abschlag zählt als 0, es bleiben die Kosten
  const an = m => {
    if (!grpOf(m)) return Z.analyze(m, S.readings, tday());
    const A = Z.analyze({ ...m, advance: 0, changes: (m.changes || []).map(c => ({ ...c, advance: 0 })) }, S.readings, tday());
    A.budgetY = null; A.budget = () => null; return A;
  };
  const anG = g => Z.analyzeGroup(g, membersOf(g).map(m => ({ m, A: an(m) })), tday());
  const isGroup = id => !!groupById(id);
  const bu = m => Z.billUnit(m);
  const lastOf = m => { const p = Z.series(m, S.readings); return p[p.length - 1] || null; };
  const isoOf = (A, t) => Z.iso(A.P.s + Math.round(t));
  const pnum = v => gg.parseNum(v);

  /* ---------- Daten ---------- */
  async function load() {
    const [m, r, p, meta, gr] = await Promise.all([db.all('meters'), db.all('readings'), db.all('periods'), db.get('meta', 'settings'), db.all('groups')]);
    S.groups = (gr || []).sort((a, b) => (a.created || 0) - (b.created || 0));
    S.meters = (m || []).sort((a, b) => (a.created || 0) - (b.created || 0));
    S.readings = r || []; S.periods = (p || []).sort((a, b) => a.start < b.start ? 1 : -1);
    S.meta = meta || { id: 'settings', remindDay: 1 };
    if (S.detail && !meterById(S.detail) && !groupById(S.detail)) S.detail = null;
  }
  async function saveMeta() { await db.put('meta', S.meta); }
  async function persistOnce() {
    if (S.meta.persistAsked) return;
    S.meta.persistAsked = true; S.meta.persisted = await gg.persist(); await saveMeta();
  }

  /* ---------- Render ---------- */
  function render() {
    const tabs = $$('#tabs button'); tabs.forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
    const fab = $('#fab');
    fab.classList.toggle('hide', !S.meters.length || (S.tab === 'more' && !S.detail) || isGroup(S.detail));
    const v = $('#view');
    if (isGroup(S.detail)) renderGroup(v); else if (S.detail) renderDetail(v); else if (S.tab === 'home') renderHome(v); else if (S.tab === 'hist') renderHist(v); else renderMore(v);
  }
  function bar(html) { $('#bar').innerHTML = html; }
  const brand = '<div class="brand">zähler<b>.</b></div>';

  /* ---------- Übersicht ---------- */
  function renderHome(v) {
    bar(brand + (S.meters.length ? '<button class="icon-btn" data-act="newMeter" aria-label="Zähler anlegen">' + ic('plus') + '</button>' : ''));
    if (!S.meters.length && !S.groups.length) { v.innerHTML = emptyHTML(); return; }
    // Einheiten, die einen Abschlag haben: Sammel-Abschläge und Zähler ohne Gruppe
    const solo = S.meters.filter(m => !grpOf(m)).map(m => ({ A: an(m) }));
    const grps = S.groups.map(g => ({ g, GA: anG(g) }));
    const units = solo.map(x => ({ ok: x.A.Y != null, A: x.A })).concat(grps.map(x => ({ ok: x.GA.complete, A: x.GA })));
    let h = '';
    if (S.meters.some(m => m.demo)) h += '<div class="card tight demo-b"><span class="chip ac">Beispiel</span><p>Beispieldaten zum Ausprobieren.</p><button class="btn sm" data-act="demoOff">Entfernen</button></div>';
    const est = units.filter(x => x.ok);
    if (units.length > 1 && est.length) {
      const tot = est.reduce((s, x) => s + x.A.diff, 0), adv = est.reduce((s, x) => s + (x.A.current.adv || 0), 0), rec = est.reduce((s, x) => s + x.A.recommend, 0);
      const hd = head(tot);
      h += '<div class="card hero"><div class="k">alles zusammen, erwartet</div><div class="head" style="margin:8px 0 0"><span class="big ' + (tot > 0 ? 'ba' : 'ok') + '" style="font-size:30px">' + hd.h + '</span><span class="lbl">' + hd.l + '</span></div>'
        + '<div class="row3"><div>Abschläge<b class="mono">' + e0(adv) + '</b></div><div>empfohlen<b class="mono">' + e0(rec) + '</b></div><div>pro Monat<b class="mono">' + (rec - adv > 0 ? '+ ' : '') + gg.num(rec - adv) + ' €</b></div></div></div>';
    }
    if (grps.length) {
      h += '<div class="h">sammel-abschlag<span class="r">' + grps.length + '</span></div>';
      grps.forEach(({ g, GA }) => { h += groupCard(g, GA); membersOf(g).forEach(m => { h += meterCard(m, an(m)); }); });
    }
    const loose = S.meters.filter(m => !grpOf(m));
    if (loose.length) { h += '<div class="h">' + (grps.length ? 'einzelne ' : 'deine ') + 'zähler<span class="r">' + loose.length + '</span></div>'; loose.forEach(m => { h += meterCard(m, an(m)); }); }
    h += '<button class="btn block" data-act="newGroup" style="margin-top:14px">' + ic('home') + 'Nebenkosten-Pauschale anlegen</button>'
      + '<p class="tiny muted" style="margin:8px 2px 0">Für einen Abschlag, der Wasser, Heizung und mehr zusammen deckt, zum Beispiel 150 € Nebenkosten im Monat.</p>';
    v.innerHTML = h;
  }
  function groupCard(g, GA) {
    const mem = membersOf(g), fx = (g.fixed || []).length;
    const sub = (GA.over ? 'beendet am ' : 'bis ') + gg.date(GA.P.last);
    let h = '<button class="card mcard" data-open="' + g.id + '"><div class="top"><div class="mt">' + ic('home') + '</div><div class="m"><div class="nm">' + esc(g.name) + '</div><div class="sb2">' + esc(sub) + '</div></div>'
      + '<span class="chip ' + (GA.status === 'none' ? '' : GA.status) + '"><span class="dot ' + (GA.status === 'none' ? '' : GA.status) + '" style="width:7px;height:7px"></span>' + ST[GA.status] + '</span></div>';
    if (GA.complete) {
      const hd = head(GA.diff), rt = GA.rel > 0.02 ? rangeText(GA.diffLow, GA.diffHigh) : '';
      h += '<div class="head"><span class="big ' + GA.status + '">' + hd.h + '</span><span class="lbl">' + hd.l + '</span></div><div class="range">' + (rt ? esc(rt) : '&nbsp;') + '</div>'
        + '<div class="adv">Abschlag <b>' + e0(GA.current.adv) + '</b><span class="arr">→</span> empfohlen <b>' + e0(GA.recommend) + '</b></div>';
    } else {
      h += '<div class="head"><span class="big none">? €</span><span class="lbl">noch keine Schätzung</span></div><div class="range">Es fehlt noch: ' + esc(GA.missing.map(x => x.name).join(', ')) + '</div>'
        + '<div class="adv">Abschlag <b>' + e0(GA.current.adv) + '</b></div>';
    }
    h += '<div class="meter"><i style="width:' + Math.round(GA.progress * 100) + '%"></i></div>';
    const left = gg.days(tday(), GA.P.end);
    h += '<div class="pline"><span>' + (GA.over ? 'Periode vorbei' : 'noch ' + left + (left === 1 ? ' Tag' : ' Tage')) + '</span><span>' + mem.length + ' Zähler' + (fx ? ' · ' + fx + ' Festposten' : '') + '</span></div>';
    return h + '</button>';
  }
  function meterCard(m, A) {
    const t = TYPES[m.type] || TYPES.sonst, G = grpOf(m);
    const sub = (A.over ? 'beendet am ' : 'bis ') + gg.date(A.P.last);
    let h = '<button class="card mcard' + (G ? ' sub' : '') + '" data-open="' + m.id + '"><div class="top"><div class="mt">' + ic(t.icon) + '</div><div class="m"><div class="nm">' + esc(m.name) + '</div><div class="sb2">' + esc(sub) + '</div></div>'
      + (G ? '<span class="chip ac">in ' + esc(G.name) + '</span>' : '<span class="chip ' + (A.status === 'none' ? '' : A.status) + '"><span class="dot ' + (A.status === 'none' ? '' : A.status) + '" style="width:7px;height:7px"></span>' + ST[A.status] + '</span>') + '</div>';
    if (G) {
      if (A.Y != null) h += '<div class="head"><span class="big none">' + e0(A.cost) + '</span><span class="lbl">Kosten im Jahr</span></div><div class="range">' + (A.mode === 'final' ? 'Periode vollständig abgelesen' : '&nbsp;') + '</div>';
      else h += '<div class="head"><span class="big none">? €</span><span class="lbl">noch keine Schätzung</span></div><div class="range">' + (A.pts.length ? 'Noch zu wenig Tage seit Abrechnungsbeginn.' : 'Trag deinen ersten Zählerstand ein.') + '</div>';
    } else if (A.Y != null) {
      const hd = head(A.diff);
      h += '<div class="head"><span class="big ' + A.status + '">' + hd.h + '</span><span class="lbl">' + hd.l + '</span></div>';
      const rt = A.rel > 0.02 ? rangeText(A.diffLow, A.diffHigh) : '';
      h += '<div class="range">' + (rt ? esc(rt) : (A.mode === 'final' ? 'Periode vollständig abgelesen' : '&nbsp;')) + '</div>';
      h += '<div class="adv">Abschlag <b>' + e0(A.current.adv) + '</b><span class="arr">→</span> empfohlen <b>' + e0(A.recommend) + '</b></div>';
    } else {
      h += '<div class="head"><span class="big none">? €</span><span class="lbl">noch keine Schätzung</span></div><div class="range">' + (A.pts.length ? 'Noch zu wenig Tage seit Abrechnungsbeginn.' : 'Trag deinen ersten Zählerstand ein.') + '</div>';
      h += '<div class="adv">Abschlag <b>' + e0(A.current.adv) + '</b></div>';
    }
    h += '<div class="meter"><i style="width:' + Math.round(A.progress * 100) + '%"></i></div>';
    const due = A.ago == null ? A.todayT >= 7 : A.ago >= 35;
    const last = A.ago == null ? 'noch nicht abgelesen' : 'zuletzt abgelesen ' + gg.relDays(-A.ago);
    const left = gg.days(tday(), A.P.end);
    h += '<div class="pline"><span>' + (A.over ? 'Periode vorbei' : 'noch ' + left + (left === 1 ? ' Tag' : ' Tage')) + '</span><span class="' + (due ? 'due' : '') + '">' + (due ? ic('clock').replace('<svg', '<svg style="width:13px;height:13px;vertical-align:-2px;margin-right:4px;stroke:currentColor;fill:none;stroke-width:2"') : '') + last + '</span></div>';
    if (A.over) h += '<div class="note" style="margin:12px 0 0">Die Abrechnungsperiode ist vorbei. Starte im Detail eine neue.</div>';
    return h + '</button>';
  }
  function emptyHTML() {
    return '<div class="empty"><div class="ico">' + ic('chart') + '</div><h3>Reicht dein Abschlag?</h3><p>Tipp einmal im Monat deine Zählerstände ein. zähler. rechnet aufs Jahr hoch und sagt dir früh, ob eine Nachzahlung kommt.</p>'
      + '<div class="btns"><button class="btn primary" data-act="newMeter">' + ic('plus') + 'Zähler anlegen</button><button class="btn" data-act="demoOn">Beispiel ansehen</button></div><div class="btns" style="margin-top:0"><button class="btn" data-act="newGroup">Nebenkosten-Pauschale anlegen</button></div></div>'
      + '<div class="feat">'
      + feat('bolt', 'Strom, Gas, Wasser, Fernwärme', 'Mit Grundpreis, Arbeitspreis und deinem monatlichen Abschlag.')
      + feat('flame', 'Rechnet mit den Jahreszeiten', 'Im Sommer heizt niemand. Gas wird nach typischem Heizprofil hochgerechnet, nicht einfach linear.')
      + feat('shield', 'Bleibt auf deinem Handy', 'Kein Konto, kein Server, keine Werbung. Funktioniert auch offline.')
      + '</div>';
  }
  const feat = (i, t, p) => '<div class="card"><div class="mt sm">' + ic(i) + '</div><div><h3>' + t + '</h3><p>' + p + '</p></div></div>';

  /* ---------- Detail ---------- */
  function renderDetail(v) {
    const m = meterById(S.detail); if (!m) { S.detail = null; return render(); }
    const A = an(m), t = TYPES[m.type] || TYPES.sonst, U = bu(m), G = grpOf(m);
    bar('<button class="icon-btn back" data-act="back" aria-label="Zurück">' + ic('back') + '</button><div class="ttl">' + esc(m.name) + '</div>' + (m.demo ? '<span class="chip ac">Beispiel</span>' : '') + '<button class="icon-btn" data-act="editMeter" aria-label="Zähler bearbeiten">' + ic('edit') + '</button>');
    let h = '';
    // Kopf
    h += '<div class="card"><div class="top"><div class="mt">' + ic(t.icon) + '</div><div class="m"><div class="nm">' + esc(t.label) + (m.number ? ' <span class="mono muted" style="font-weight:400;font-size:13px">' + esc(m.number) + '</span>' : '') + '</div><div class="sb2">' + gg.dateShort(A.P.start) + ' bis ' + gg.date(A.P.last) + '</div></div>' + (G ? '<span class="chip ac">in ' + esc(G.name) + '</span>' : '<span class="chip ' + (A.status === 'none' ? '' : A.status) + '">' + ST[A.status] + '</span>') + '</div>';
    if (G && A.Y != null) {
      h += '<div class="head"><span class="big none">' + e0(A.cost) + '</span><span class="lbl">Kosten im Jahr</span></div>';
      const rt = A.rel > 0.02 ? 'Spanne ' + gg.num(r5(A.cost * (1 - A.rel))) + ' bis ' + gg.num(r5(A.cost * (1 + A.rel))) + ' €' : '';
      if (rt) h += '<div class="range">' + esc(rt) + '</div>';
      h += '<div class="note" style="margin:0">Den Abschlag zahlst du gesammelt über <b>' + esc(G.name) + '</b>. Ob er reicht, siehst du dort.<br><button class="btn sm" data-open="' + G.id + '" style="margin-top:10px">' + esc(G.name) + ' ansehen</button></div>';
    } else if (A.Y != null) {
      const hd = head(A.diff);
      h += '<div class="head"><span class="big ' + A.status + '">' + hd.h + '</span><span class="lbl">' + hd.l + '</span></div>';
      const rt = A.rel > 0.02 ? rangeText(A.diffLow, A.diffHigh) : '';
      if (rt) h += '<div class="range">' + esc(rt) + '</div>';
      h += '<div class="adv">Abschlag <b>' + e0(A.current.adv) + '</b><span class="arr">→</span> empfohlen <b>' + e0(A.recommend) + '</b></div>';
      let msg;
      if (A.mode === 'final') msg = 'Die Periode ist vollständig abgelesen. Das Ergebnis entspricht ungefähr deiner Jahresabrechnung.';
      else if (A.status === 'ok') msg = 'Dein Abschlag passt. Wenn du so weiter verbrauchst, kommt keine nennenswerte Nachzahlung.';
      else msg = 'Wenn du so weiter verbrauchst, fehlen am Periodenende etwa <b>' + e0(A.diff) + '</b>.' + (A.needFromNow != null && A.needFromNow > A.recommend ? ' Um das bis dahin aufzufangen, bräuchtest du ab jetzt <b>' + e0(A.needFromNow) + '</b> im Monat.' : ' Erhöh deinen Abschlag auf <b>' + e0(A.recommend) + '</b>, dann passt es.');
      h += '<div class="note" style="margin:0">' + msg + '</div>';
    } else {
      h += '<div class="note" style="margin:14px 0 0">' + (A.pts.length ? 'Seit Abrechnungsbeginn sind erst wenige Tage vergangen. Lies in ein bis zwei Wochen noch einmal ab, dann gibt es eine erste Schätzung.' : 'Noch keine Ablesung in dieser Periode. Tipp unten rechts auf Plus und trag den aktuellen Stand ein.') + (m.prevYear ? '' : ' Mit dem Vorjahresverbrauch aus deiner letzten Rechnung geht es schneller.') + '</div>';
    }
    h += '</div>';
    if (A.Y != null && A.Fl < 0.10 && A.mode !== 'final') h += '<div class="warn"><b>Noch wenig Daten.</b> Erst ' + pct(A.Fl) + ' des Jahresverbrauchs fallen typischerweise in den abgelesenen Zeitraum. Die Schätzung ist grob' + (A.prev ? ' und stützt sich stark auf dein Vorjahr.' : '.') + '</div>';
    if (A.over) h += '<div class="warn"><b>Periode beendet.</b> Der Abrechnungszeitraum endete am ' + gg.date(A.P.last) + '. Trag den Stand zum Stichtag ein und starte dann eine neue Periode.<br><button class="btn sm primary" data-act="newPeriod">Neue Abrechnungsperiode</button></div>';
    // Kennzahlen
    if (A.pts.length || A.Y != null) {
      const conv = m.conv && A.factor !== 1;
      h += '<div class="h">kennzahlen</div><div class="stats">'
        + stat('Verbrauch bisher', fc(A.used) + ' ' + U, conv ? fc(A.usedM) + ' ' + esc(m.unit) : (A.lastDate ? 'bis ' + gg.date(A.lastDate) : ''))
        + stat('Hochrechnung Jahr', A.Y != null ? fc(A.Y) + ' ' + U : '·', A.Y != null && A.rel > 0.02 ? '± ' + gg.num(A.rel * 100, 0) + ' %' : (A.mode === 'final' ? 'abgelesen' : ''))
        + stat('Jahreskosten', A.Y != null ? e0(A.cost) : '·', A.Y != null && !G ? 'gezahlt ' + e0(A.paid) : '')
        + stat('Ø pro Tag', A.perDay != null ? gg.num(A.perDay, A.perDay < 10 ? 2 : 1) + ' ' + U : '·', A.perDay != null && A.Y != null ? 'Jahresschnitt ' + gg.num(A.Y / A.T, A.Y / A.T < 10 ? 2 : 1) : '')
        + stat('Vergleich Vorjahr', A.vsPrev != null ? (A.vsPrev > 0 ? '+ ' : A.vsPrev < 0 ? '− ' : '') + gg.num(Math.abs(A.vsPrev * 100), 0) + ' %' : '·', A.prev ? 'Vorjahr ' + fc(A.prev) + ' ' + U : 'Vorjahr fehlt', A.vsPrev == null ? '' : A.vsPrev > 0.05 ? 'wa' : A.vsPrev < -0.05 ? 'ok' : '')
        + stat('Bisher fällig', A.Y != null ? e0(A.dueSoFar) : '·', A.Y != null && !G ? 'gezahlt ' + e0(A.paidSoFar) : '')
        + '</div>';
      if (A.Fl > 0) h += '<p class="hint" style="margin:10px 2px 0">' + pct(A.Fl) + ' des Jahresverbrauchs fallen typischerweise in den Zeitraum ' + gg.dateShort(A.P.start) + ' bis ' + gg.dateShort(A.lastDate) + '</p>';
    }
    // Diagramme
    if (A.Y != null || A.pts.length) {
      h += '<div class="h">verlauf</div><div class="card"><div class="ch-t"><h3>Verbrauch kumuliert</h3><span class="tiny muted mono">' + U + '</span></div><div class="cw" id="cum">' + cumChart(m, A) + '<div class="tip"></div></div>'
        + '<div class="lg"><span><i></i>abgelesen</span>' + (A.Y != null && A.mode !== 'final' ? '<span><i class="d"></i>Hochrechnung</span>' : '') + (A.budgetY != null ? '<span><i class="n"></i>deckt dein Abschlag</span>' : '') + '</div></div>';
      h += '<div class="card"><div class="ch-t"><h3>Verbrauch pro Monat</h3><span class="tiny muted mono">' + U + '</span></div><div class="cw" id="mon">' + monChart(m, A) + '<div class="tip"></div></div>'
        + '<div class="lg"><span><i class="b"></i>aus Ablesungen</span>' + (A.Y != null && A.mode !== 'final' ? '<span><i class="b p"></i>geschätzt</span>' : '') + '</div></div>';
    }
    // Ablesungen
    const pts = A.pts.slice().reverse();
    h += '<div class="h">ablesungen<span class="r">' + A.pts.length + '</span></div><div class="list">';
    pts.forEach(p => {
      const r = S.readings.find(x => x.id === p.id); if (!r) return;
      const th = r.photo ? '<img class="thumb" alt="" src="' + gg.blobUrl(r.id + ':' + (r.updated || r.created || 0), r.photo) + '">' : '<span class="thumb dt">' + gg.d(p.date).getDate() + '<small>' + MN[gg.d(p.date).getMonth()].slice(0, 3) + '</small></span>';
      h += '<button class="item" data-reading="' + r.id + '">' + th + '<div class="m"><div class="t mono">' + fv(p.value) + ' <span class="muted" style="font-size:12px">' + esc(m.unit) + '</span>' + '</div><div class="s">' + (p.swap ? '<span class="wa">Zählerwechsel</span> · ' : '') + gg.date(p.date) + (r.note ? ' · ' + esc(r.note) : '') + '</div></div>'

  function groupSheet(g) {

      + '<label class="field"><span>Abschlag</span><div class="uw"><input id="g-adv" class="mono" inputmode="decimal" placeholder="z. B. 150" value="' + fin(g.advance) + '"><span class="u">€/Mon</span></div></label></div>'

      + '<div class="btns">' + (isNew ? '<button class="btn" data-close>Abbrechen</button>' : '') + '<button class="btn primary" id="g-save">' + (isNew ? 'Anlegen' : 'Speichern') + '</button></div>';

      if (!/^\d{4}-\d{2}-\d{2}$/.test(start)) return gg.toast('Wähle den Abrechnungsbeginn.');
      if (!isFinite(adv) || adv < 0) return gg.toast('Trag den monatlichen Abschlag ein.');

  const stat = (k, val, x, cls) => '<div class="stat"><div class="k">' + k + '</div><div class="v ' + (cls || '') + '">' + val + '</div>' + (x ? '<div class="x">' + x + '</div>' : '<div class="x">&nbsp;</div>') + '</div>';

  function howHTML(m, A) {
    const U = bu(m), prof = m.type === 'gas' || m.type === 'fern' ? 'Heizprofil (Winter viel, Sommer kaum)' : m.type === 'strom' ? 'Haushaltsprofil Strom (Winter etwas mehr)' : 'gleichmäßig über alle Tage';
    let h = '<details class="how"><summary>' + ic('search').replace('<svg', '<svg style="width:18px;height:18px;stroke:var(--mu);fill:none;stroke-width:1.8"') + 'So rechnen wir</summary><div class="in">';
    h += '<p><b>1. Verbrauch bisher.</b> Letzter Stand minus Startstand' + (A.pts.some(p => p.swap) ? ', bei Zählerwechsel beide Zähler zusammen' : '') + (m.conv ? ', dann m³ × Brennwert × Zustandszahl = kWh' : '') + '.</p>';
    h += '<p><b>2. Jahreszeit.</b> Verteilung nach ' + prof + ', tagesgenau. Daraus folgt, welcher Anteil des Jahresverbrauchs bis zur letzten Ablesung typischerweise schon angefallen ist.</p>';
    h += '<p><b>3. Hochrechnung.</b> Verbrauch geteilt durch diesen Anteil. Bei wenig Daten mischen wir den Vorjahresverbrauch dazu, je mehr Daten, desto weniger.</p>';
    h += '<p><b>4. Kosten.</b> Jahresverbrauch × Arbeitspreis + 12 × Grundpreis.' + (grpOf(m) ? ' Diese Kosten gehen in den Sammel-Abschlag ein.' : ' Davon ziehen wir 12 Abschläge ab.') + '</p>';
    if (A.Y != null && A.pts.length) {
      const C = A.current;
      h += '<div class="fx">'
        + fc(A.used) + ' ' + U + ' bisher<br>'
        + '÷ ' + pct(A.Fl) + ' <span class="muted">typischer Anteil</span><br>'

  /* ---------- Ablesung ---------- */

  /* ---------- Neue Abrechnungsperiode ---------- */

      await db.put('periods', { id: gg.uid(), meterId: m.id, start: m.start, end: start, startValue: +m.startValue || 0, endValue: sett ? sett.endValue : null, lastReading: sett ? sett.end : null, cons: sett ? sett.cons : 0, unit: U, cost: sett ? sett.cost : 0, paid: sett ? sett.paid : 0, diff: sett ? sett.diff : 0, annual: sett ? sett.annual : null, created: Date.now(), demo: m.demo || undefined });
      Object.assign(m, { start, startValue: svv, price, base, advance: adv, prevYear: pr, changes: (m.changes || []).filter(c => c.from > start), updated: Date.now() });
      await db.put('meters', m); await load(); d.close(); render(); window.scrollTo(0, 0);
      gg.toast('Neue Periode ab ' + gg.date(start));
    };
  }

  /* ---------- Export ---------- */
  async function exportICS() {
    const day = +($('#rday') ? $('#rday').value : S.meta.remindDay) || 1;
    S.meta.remindDay = day; await saveMeta();
    const t = tday(); let first = t.slice(0, 8) + String(day).padStart(2, '0'); if (first < t) first = gg.addMonths(first, 1);
    const ev = [{ uid: 'zaehler-monatlich', title: 'Zählerstände ablesen', date: first, desc: 'Zählerstände ablesen und in zähler. eintragen: ' + (S.meters.map(m => m.name).join(', ') || 'Strom, Gas, Wasser') + '.', rrule: 'FREQ=MONTHLY;BYMONTHDAY=' + day, alarm: [0] }];
    S.meters.forEach(m => {
      const P = Z.period(m); if (P.last < t) return;
      ev.push({ uid: 'zaehler-ende-' + m.id + '-' + P.last, title: 'Stichtag ' + m.name + ': Zählerstand ablesen', date: P.last, desc: 'Ende der Abrechnungsperiode. Stand ablesen, Foto machen und danach in zähler. eine neue Periode starten.', alarm: [3, 0] });
    });
    await gg.shareFile('zaehler-erinnerung.ics', gg.ics('zähler.', ev), 'text/calendar');
  }
  async function exportCSV() {
    const rows = [['Zähler', 'Typ', 'Zählernummer', 'Datum', 'Stand', 'Einheit', 'Verbrauch seit vorher', 'Einheit Verbrauch', 'Tage', 'Ø pro Tag', 'Zählerwechsel', 'Endstand alt', 'Start neu', 'Notiz', 'Foto']];
    readingRows().reverse().forEach(({ r, m, delta, days }) => {
      rows.push([m.name, (TYPES[m.type] || TYPES.sonst).label, m.number || '', gg.date(r.date), +r.value, m.unit, delta != null ? +delta.toFixed(3) : '', bu(m), days != null ? days : '', delta != null && days ? +(delta / days).toFixed(3) : '', r.swap ? 'ja' : '', r.swap ? +r.swap.oldEnd : '', r.swap ? +r.swap.newStart : '', r.note || '', r.photo ? 'ja' : '']);
    });
    await gg.shareFile('zaehler-ablesungen-' + tday() + '.csv', gg.csv(rows), 'text/csv;charset=utf-8');
  }
  async function exportBackup() {
    const json = await gg.backupExport('zaehler', db);
    await gg.shareFile('zaehler-sicherung-' + tday() + '.json', json, 'application/json');
  }
  async function importBackup() {
    const f = await gg.pickFile('application/json,.json'); if (!f) return;
    const text = await f.text();
    let data; try { data = JSON.parse(text); } catch (e) { return gg.toast('Die Datei ist keine gültige Sicherung.'); }
    if (data.app !== 'zaehler') return gg.toast('Das ist keine Sicherung von zähler.');
    const n = (data.stores.meters || []).length, k = (data.stores.readings || []).length;
    if (!(await gg.confirm('Sicherung mit ' + n + ' Zählern und ' + k + ' Ablesungen einspielen? Die Daten auf diesem Gerät werden ersetzt.', 'Einspielen', false))) return;
    try { await gg.backupImport('zaehler', db, text); if (!data.stores.groups) await db.clear('groups'); } catch (e) { return gg.toast(e.message || 'Import fehlgeschlagen'); }
    await load(); S.detail = null; S.tab = 'home'; render(); gg.toast('Sicherung eingespielt');
  }

  /* ---------- Beispiel ---------- */
  async function loadDemo() {
    const now = tday(); let y = +now.slice(0, 4); if (gg.days(y + '-01-01', now) < 75) y--;
    const start = y + '-01-01', P = Z.period({ start }), T = P.T;
    const end = Math.min(gg.days(start, now) - 6, T - 1);
    const steps = [30, 32, 29, 30, 31, 29, 30, 31, 29, 30, 31, 30];
    const ts = []; let t = 0; for (const s of steps) { t += s; if (t >= end - 8) break; ts.push(t); } ts.push(end);
    const noise = [1.03, 0.97, 1.05, 0.98, 1.02, 0.96, 1.04, 1.0, 0.99, 1.03, 1.01, 0.98];
    const mk = (base, Yv, type, f) => {
      const W = Z.weights(type, start, T); let cum = 0, prevF = 0; const vals = [];
      ts.forEach((tt, i) => { const dF = W[tt] - prevF; cum += Yv * dF * noise[i % noise.length]; prevF = W[tt]; vals.push(+(base + cum / f).toFixed(type === 'gas' ? 2 : 0)); });
      return vals;
    };
    const c = Date.now();
    const strom = { id: 'demo-strom', demo: true, type: 'strom', name: 'Strom Wohnung', unit: 'kWh', number: '1EMH0012 4471 93', start, startValue: 18402, price: 32.4, base: 12.5, advance: 85, prevYear: 2780, conv: false, hs: 11.2, z: 0.95, changes: [], created: c };
    const gas = { id: 'demo-gas', demo: true, type: 'gas', name: 'Gas Heizung', unit: 'm³', number: 'G4 7712093', start, startValue: 4218.36, price: 11.8, base: 14.9, advance: 125, prevYear: 11400, conv: true, hs: 11.2, z: 0.95, changes: [], created: c + 1 };
    const sv = mk(strom.startValue, 3080, 'strom', 1), gv = mk(gas.startValue, 10650, 'gas', 10.64);
    const notes = { 3: 'nach Urlaub', 7: 'Foto im Keller vergessen' };
    for (const m of [strom, gas]) await db.put('meters', m);
    for (let i = 0; i < ts.length; i++) {
      const date = Z.iso(P.s + ts[i]);
      await db.put('readings', { id: 'demo-s' + i, demo: true, meterId: strom.id, date, value: sv[i], swap: null, note: notes[i] || '', created: c + i, photo: null });
      await db.put('readings', { id: 'demo-g' + i, demo: true, meterId: gas.id, date, value: gv[i], swap: null, note: '', created: c + i, photo: null });
    }
    const ps = (y - 1) + '-01-01';
    await db.put('periods', { id: 'demo-ps', demo: true, meterId: strom.id, start: ps, end: start, cons: 2780, unit: 'kWh', cost: 2780 * 0.31 + 12 * 11.9, paid: 12 * 82, diff: 2780 * 0.31 + 12 * 11.9 - 12 * 82, annual: 2780, created: c });
    await db.put('periods', { id: 'demo-pg', demo: true, meterId: gas.id, start: ps, end: start, cons: 11400, unit: 'kWh', cost: 11400 * 0.112 + 12 * 14.9, paid: 12 * 130, diff: 11400 * 0.112 + 12 * 14.9 - 12 * 130, annual: 11400, created: c });
    await load(); render(); gg.toast('Beispiel geladen');
  }
  async function removeDemo() {
    for (const r of S.readings.filter(r => r.demo || String(r.meterId).startsWith('demo-'))) await db.del('readings', r.id);
    for (const p of S.periods.filter(p => p.demo || String(p.meterId).startsWith('demo-'))) await db.del('periods', p.id);
    for (const m of S.meters.filter(m => m.demo)) await db.del('meters', m.id);
    S.detail = null; await load(); render(); gg.toast('Beispiel entfernt');
  }

  /* ---------- Ereignisse ---------- */
  function openDetail(id) { S.detail = id; history.pushState({ d: id }, ''); render(); window.scrollTo(0, 0); }
  function closeDetail() { if (history.state && history.state.d) history.back(); else { S.detail = null; render(); } }
  window.addEventListener('popstate', () => { const st = history.state; S.detail = st && st.d && (meterById(st.d) || groupById(st.d)) ? st.d : null; render(); window.scrollTo(0, 0); });

  document.addEventListener('click', async e => {
    const t = e.target.closest('[data-act],[data-open],[data-reading],[data-filter],button[data-theme],[data-delchange],[data-item]');
    if (!t || t.closest('dialog')) return;
    if (t.dataset.open) return openDetail(t.dataset.open);
    if (t.dataset.reading) { const r = S.readings.find(x => x.id === t.dataset.reading); if (r) readingSheet(r); return; }
    if (t.dataset.filter) { S.filter = t.dataset.filter; return render(); }
    if (t.dataset.theme) { setTheme(t.dataset.theme); return render(); }
    if (t.dataset.delchange) {
      const m = meterById(S.detail) || groupById(S.detail), tb = meterById(S.detail) ? 'meters' : 'groups'; if (!m) return;
      if (!(await gg.confirm((tb === 'groups' ? 'Änderung' : 'Preisänderung') + ' ab ' + gg.date(t.dataset.delchange) + ' löschen?'))) return;
      m.changes = (m.changes || []).filter(c => c.from !== t.dataset.delchange); await db.put(tb, m); await load(); return render();
    }
    const g = groupById(S.detail);
    if (t.dataset.item) { const it = g && (g.fixed || []).find(x => x.id === t.dataset.item); return it && itemSheet(g, it); }
    const m = meterById(S.detail);
    switch (t.dataset.act) {
      case 'newMeter': return meterSheet();
      case 'newGroup': return groupSheet();
      case 'editGroup': return g && groupSheet(g);
      case 'addItem': return g && itemSheet(g);
      case 'groupPrice': return g && groupPriceSheet(g);
      case 'groupPeriod': return g && groupPeriodSheet(g);
      case 'delGroup':
        if (!g || !(await gg.confirm('"' + g.name + '" mit allen Festposten und früheren Perioden löschen? Die Zähler darin bleiben erhalten und bekommen wieder einen eigenen Abschlag.'))) return;
        for (const x of membersOf(g)) await db.put('meters', { ...x, group: null });
        for (const p of S.periods.filter(p => p.meterId === g.id)) await db.del('periods', p.id);
        await db.del('groups', g.id); await load(); closeDetail(); return gg.toast('Gelöscht');
      case 'editMeter': return m && meterSheet(m);
      case 'back': return closeDetail();
      case 'addReading': return readingSheet(null, m && m.id);
      case 'priceChange': return m && priceSheet(m);
      case 'newPeriod': return m && periodSheet(m);
      case 'delMeter':
        if (!m || !(await gg.confirm('"' + m.name + '" mit allen Ablesungen, Fotos und früheren Perioden löschen? Das lässt sich nicht rückgängig machen.'))) return;
        for (const r of S.readings.filter(r => r.meterId === m.id)) await db.del('readings', r.id);
        for (const p of S.periods.filter(p => p.meterId === m.id)) await db.del('periods', p.id);
        await db.del('meters', m.id); await load(); closeDetail(); return gg.toast('Zähler gelöscht');
      case 'demoOn': return loadDemo();
      case 'demoOff': return removeDemo();
      case 'ics': return exportICS();
      case 'csv': return S.readings.length && exportCSV();
      case 'backup': return exportBackup();
      case 'restore': return importBackup();
      case 'persist': S.meta.persistAsked = true; S.meta.persisted = await gg.persist(); await saveMeta(); render(); return gg.toast(S.meta.persisted ? 'Speicher ist jetzt dauerhaft' : 'Der Browser hat abgelehnt. Mach regelmäßig eine Sicherung.');
      case 'wipe':
        if (!(await gg.confirm('Alle Zähler, Ablesungen, Fotos und Einstellungen auf diesem Gerät löschen?', 'Alles löschen'))) return;
        for (const s of db.names) await db.clear(s);
        S.detail = null; S.tab = 'home'; S.filter = 'all'; await load(); render(); return gg.toast('Alles gelöscht');
    }
  });
  $$('#tabs button').forEach(b => b.onclick = () => { if (S.detail) { S.detail = null; if (history.state && history.state.d) history.replaceState(null, ''); } S.tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
  $('#fab').onclick = () => S.meters.length ? readingSheet(null, meterById(S.detail) ? S.detail : null) : meterSheet();
  $$('#tabs [data-i]').forEach(s => { s.outerHTML = ic(s.dataset.i); });
  $('#fab').innerHTML = ic('plus');

  function setTheme(t) {
    gg.theme(t);
    const mc = document.querySelector('meta[name=theme-color]'); if (mc) mc.content = t === 'light' ? '#f6f5f9' : '#0d0d10';
  }

  /* ---------- Start ---------- */
  setTheme(gg.theme());
  try { db = await gg.openDB('zaehler', ['meters', 'readings', 'periods', 'meta', 'groups'], 2); await load(); }
  catch (e) { $('#view').innerHTML = '<div class="err">Der lokale Speicher ist nicht verfügbar. Im privaten Modus funktioniert zähler. eventuell nicht.</div>'; return; }
  history.replaceState(null, '');
  render();
  gg.sw();
})();
</script></body></html>
